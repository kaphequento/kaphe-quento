<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashin Lobby</title>
<style>
:root{
  --bg:#120b2e; --panel:#1d1545; --line:#ffffff1f; --gold:#ffb703; --hot:#fb5607; --ink:#f5f1ff; --mute:#a99fd6; --good:#3ddc97; --bad:#ff6b81;
  --font:system-ui,"Segoe UI",Roboto,sans-serif; --disp:"Trebuchet MS","Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120b2e}}
:root[data-theme="dark"]{--bg:#120b2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--panel);padding:1.2rem .9rem;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-family:var(--disp);font-weight:900;font-size:1.9rem;font-style:italic;color:var(--gold);margin:0 0 1.2rem .4rem}
.nav{display:flex;flex-direction:column;gap:.3rem}
.nav button{background:none;border:0;color:var(--ink);text-align:left;padding:.7rem .8rem;border-radius:10px;transition:background .2s,transform .2s}
.nav button[aria-current="true"]{background:var(--gold);color:#1a1200;font-weight:700}
.nav button:hover:not([aria-current="true"]){background:#ffffff14;transform:translateX(4px)}
main{padding:1rem 1.4rem 3rem;min-width:0}
.top{display:flex;gap:.8rem;align-items:center;margin-bottom:1.2rem;flex-wrap:wrap}
.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.7rem 1.1rem;color:var(--ink)}
.wallet{background:var(--panel);border:2px solid var(--gold);border-radius:999px;padding:.45rem 1rem;font-weight:800}
.wallet small{color:var(--mute);font-weight:400;margin-right:.4rem}
.wallet.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.12);box-shadow:0 0 18px var(--gold)}}
.tu{background:var(--gold);color:#1a1200;border:0;border-radius:999px;padding:.55rem 1rem;font-weight:800;animation:glow 2.4s infinite}
@keyframes glow{50%{box-shadow:0 0 14px #ffb703aa}}
h2{font-family:var(--disp);font-size:1.4rem;margin:1.2rem 0 .8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9rem}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.cell{position:relative;opacity:0;animation:rise .5s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.tile{position:relative;width:100%;border:0;border-radius:16px;aspect-ratio:3/4;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:.8rem;text-align:left;transition:transform .2s,box-shadow .2s}
.big .tile{aspect-ratio:16/10}
.tile:hover{transform:translateY(-6px);box-shadow:0 12px 24px #0007}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#ffffff40 50%,transparent 60%);transform:translateX(-120%);transition:transform .6s}
.tile:hover::after{transform:translateX(120%)}
.tile .em{position:absolute;top:14%;left:50%;width:42%;margin-left:-21%;filter:drop-shadow(0 4px 6px #0006);animation:float 3.2s ease-in-out infinite}
.big .tile .em{width:30%;margin-left:-15%;top:10%}
.tile .em svg{width:100%;height:auto;display:block}
.tile .sub{position:absolute;right:.6rem;top:.6rem;font-size:1.3rem}
@keyframes float{50%{transform:translateY(-6px) rotate(3deg)}}
.tile b{font-family:var(--disp);font-size:1rem;text-shadow:0 2px 4px #0008;line-height:1.15}
.tile i{font-style:normal;font-size:.75rem;opacity:.85}
.badge{position:absolute;top:.6rem;left:.6rem;background:var(--hot);border-radius:6px;padding:.1rem .45rem;font-size:.7rem;font-weight:800;animation:glow 1.8s infinite}
.badge.new{background:var(--good);color:#06281a}
.fav{position:absolute;top:.4rem;right:.4rem;background:#0005;border:0;color:#fff;border-radius:50%;width:32px;height:32px;font-size:1rem;z-index:2;transition:transform .2s}
.fav:hover{transform:scale(1.2)}
.fav[aria-pressed="true"]{color:#ff4d6d}
.tile .sub{right:2.8rem}
.empty{color:var(--mute);padding:2rem 0}
.foot{color:var(--mute);font-size:.8rem;text-align:center;margin-top:2.5rem}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:1rem;z-index:10}
#tp{z-index:20}
.ov[hidden]{display:none}
.modal{background:var(--panel);border-radius:20px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:1.2rem;border:1px solid var(--line);animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.mh{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.6rem}
.mh .ttl{display:flex;align-items:center;gap:.6rem}
.mh .ttl svg{width:44px;height:44px;border-radius:12px;flex:none}
.mh h3{margin:0;font-family:var(--disp);font-size:1.3rem}
.x{background:#ffffff14;border:0;color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:1.2rem}
.chips{display:flex;gap:.4rem;align-items:center;margin:.6rem 0;flex-wrap:wrap}
.chip{min-width:52px;height:44px;padding:0 .8rem;border-radius:999px;border:2px solid var(--line);background:#ffffff0d;color:var(--ink);font-weight:700;transition:transform .15s}
.chip:active{transform:scale(.92)}
.chip[aria-pressed="true"]{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.go{background:var(--gold);color:#1a1200;border:0;border-radius:12px;padding:.8rem 1.5rem;font-weight:800;transition:transform .15s}
.go:active:not(:disabled){transform:scale(.94)}
.go:disabled,.alt:disabled{opacity:.4;cursor:not-allowed}
.alt{background:none;border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:.8rem 1.2rem;font-weight:600}
.row,.packs{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:.9rem}
.msg{text-align:center;min-height:1.5em;margin-top:.9rem;font-weight:700}
.win{color:var(--good);animation:pulse .6s 2}.lose{color:var(--bad)}
@keyframes pulse{50%{transform:scale(1.15)}}
.reels{display:flex;gap:.6rem;justify-content:center;margin:1rem 0}
.reel{width:92px;height:100px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:3rem;box-shadow:inset 0 0 0 4px var(--gold)}
.spinning{animation:spin .14s linear infinite;filter:blur(1px)}
@keyframes spin{0%{transform:translateY(-8px)}50%{transform:translateY(8px)}100%{transform:translateY(-8px)}}
.land{animation:land .45s ease}
@keyframes land{0%{transform:scale(1.25)}60%{transform:scale(.94)}100%{transform:scale(1)}}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.ct{height:76px;border:3px solid #fff8;border-radius:12px;color:#111;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;transition:transform .15s}
.ct:hover{transform:scale(1.05)}
.ct.d{color:#fff}.ct b{background:#000a;color:#fff;border-radius:999px;padding:0 .6rem;min-height:1.3em;font-size:.85rem}
.hand{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin:.4rem 0;min-height:84px}
.card{width:56px;height:80px;border-radius:9px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem;animation:deal .35s ease}
@keyframes deal{from{opacity:0;transform:translateY(-30px) rotate(-12deg)}to{opacity:1;transform:none}}
.card.r{color:#d7263d}.card.bk{background:repeating-linear-gradient(45deg,#7f1d1d,#7f1d1d 6px,#991b1b 6px,#991b1b 12px)}
.lbl{text-align:center;color:var(--mute);font-size:.9rem}
.rb{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:.4rem;margin-top:.6rem}
.rb button{padding:.7rem .3rem;border-radius:10px;border:2px solid var(--line);color:#fff;font-weight:700}
.rb button[aria-pressed="true"]{outline:3px solid var(--gold)}
.ball{width:110px;height:110px;margin:1rem auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:900;border:6px solid var(--gold);background:#333}
#au{z-index:30}.lo{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:.5rem .9rem}.tabs{display:flex;gap:.4rem;margin:.6rem 0}.fi{width:100%;background:#ffffff0d;border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;color:var(--ink);margin-top:.6rem}
.ag{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;margin:1rem 0}
.ac{height:58px;border-radius:8px;background:#fff;color:#111;font-weight:800;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.ac.r{color:#d7263d}.ac.gd{background:linear-gradient(#ffe27a,#d99a00)}.ac.h{outline:3px solid var(--good);animation:pulse .5s}
/* demo top-up */
.demo{display:inline-block;background:#ffb70333;color:var(--gold);border:1px solid var(--gold);border-radius:6px;font-size:.65rem;font-weight:800;padding:.1rem .4rem;margin-left:.4rem;vertical-align:middle}
.meth{display:grid;gap:.5rem;margin:.7rem 0}
.meth button{display:flex;gap:.7rem;align-items:center;text-align:left;background:#ffffff0d;border:2px solid var(--line);border-radius:12px;color:var(--ink);padding:.6rem .8rem;transition:border-color .2s,transform .2s}
.meth button:hover{transform:translateX(4px)}
.meth button[aria-pressed="true"]{border-color:var(--gold);background:#ffb70322}
.meth .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex:none}
.meth small{display:block;color:var(--mute)}
.amts{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:.4rem;margin:.6rem 0}
.proc{text-align:center;padding:1rem 0}
.sp{width:46px;height:46px;border:5px solid #ffffff2a;border-top-color:var(--gold);border-radius:50%;margin:0 auto .8rem;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ok{width:64px;height:64px;border-radius:50%;background:var(--good);color:#06281a;font-size:2rem;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto .8rem;animation:land .5s}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.pc{position:absolute;top:-20px;font-size:1.4rem;animation:fall var(--t) ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}
/* help chat */
#hb{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:40;background:var(--gold);color:#1a1200;border:0;border-radius:999px;padding:.8rem 1.1rem;font-weight:800;box-shadow:0 6px 18px #0008}
#hp{position:fixed;right:1rem;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 2rem));height:min(460px,70vh);z-index:41;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;animation:pop .25s ease}
#hp[hidden]{display:none}
.hh{padding:.7rem .9rem;background:#ffffff10;display:flex;justify-content:space-between;align-items:center}
.hh b{display:block}.hh small{color:var(--mute)}
#hl{flex:1;overflow:auto;padding:.7rem;display:flex;flex-direction:column;gap:.5rem}
.b{max-width:85%;padding:.5rem .7rem;border-radius:12px;font-size:.9rem;animation:rise .25s ease forwards;opacity:0}
.b.bot{background:#ffffff14;align-self:flex-start}.b.me{background:var(--gold);color:#1a1200;align-self:flex-end}
.qr{display:flex;gap:.3rem;flex-wrap:wrap;padding:0 .7rem .4rem}
.qr button{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:.3rem .6rem;font-size:.78rem}
.hi{display:flex;gap:.4rem;padding:.6rem;border-top:1px solid var(--line)}
.hi input{flex:1;background:#ffffff0d;border:1px solid var(--line);border-radius:999px;padding:.5rem .9rem;color:var(--ink)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:.7rem}
  .logo{margin-bottom:.5rem}
  .nav{flex-direction:row;overflow-x:auto}
  .nav button{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cell{opacity:1}.b{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1 class="logo">Cashin</h1>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main>
    <div class="top">
      <input class="search" id="q" type="search" placeholder="Search games" aria-label="Search games">
      <div class="wallet" id="wl"><small id="who">Wallet</small><span id="bal"></span></div>
      <button class="tu" id="topbtn">+ Top Up</button>
      <button class="lo" id="logout">Log out</button>
    </div>
    <div id="view"></div>
    <p class="foot">Cashin is a demo with play money only. No deposits, no real winnings, no real payments.</p>
  </main>
</div>

<div class="ov" id="ov" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><div class="ttl"><span id="ml"></span><h3 id="mt"></h3></div><button class="x" id="mx" aria-label="Close game">✕</button></div>
    <div class="chips" id="chips"><span class="lbl">Bet</span></div>
    <div id="game"></div>
  </div>
</div>

<div class="ov" id="tp" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tt">
    <div class="mh"><h3 id="tt">Top Up Center<span class="demo">DEMO</span></h3><button class="x" id="tx" aria-label="Close top up">✕</button></div>
    <div id="tb"></div>
  </div>
</div>

<div class="ov" id="au">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="at">
    <h3 id="at" class="logo" style="margin:0">Cashin</h3>
    <div class="tabs"><button class="chip" id="tl" aria-pressed="true">Login</button><button class="chip" id="tr" aria-pressed="false">Register</button></div>
    <input class="fi" id="un" placeholder="Username" autocomplete="username" aria-label="Username" maxlength="20">
    <input class="fi" id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" maxlength="30">
    <div class="msg" id="am"></div>
    <div class="row"><button class="go" id="as">Login</button></div>
    <p class="lbl">New players get ₱2,000 free play money. Accounts are demo-only and stay on this device. Don't use a real password.</p>
  </div>
</div>

<button id="hb" aria-expanded="false" aria-controls="hp">💬 Help</button>
<div id="hp" hidden role="dialog" aria-label="Demo help chat">
  <div class="hh"><div><b>Demo Assistant</b><small>Automated bot, not a real person</small></div><button class="x" id="hx" aria-label="Close help">✕</button></div>
  <div id="hl" aria-live="polite"></div>
  <div class="qr" id="qr"></div>
  <div class="hi"><input id="hi" placeholder="Type a question" aria-label="Type a question" maxlength="120"><button class="go" id="hs" style="padding:.5rem 1rem">Send</button></div>
</div>
<div id="fx" aria-hidden="true"></div>

<script>
(function(){
  var $ = function(i){ return document.getElementById(i); };
  var bal = 0, stake = 10, allin = false, favs = {}, recent = [], cat = "home", paying = false, MAXTOP = 500000;
  function load(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } }
  function put(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  var users = load("cashin_users", {}), me = null, mode = "login";
  function has(k){ return Object.prototype.hasOwnProperty.call(users, k); }
  /* preset account: Rey / 022 / ₱100,000 (created only if it doesn't exist yet) */
  if(!has("rey")){ users["rey"] = {name:"Rey", pw:"022", bal:100000}; put("cashin_users", users); }
  if(!has("raffy")){ users["raffy"] = {name:"Raffy", pw:"123", bal:100000000}; put("cashin_users", users); }
  if(!has("matthew")){ users["matthew"] = {name:"Matthew", pw:"123", bal:100000000}; put("cashin_users", users); }
  if(!has("naph")){ users["naph"] = {name:"Naph", pw:"123", bal:100000000}; put("cashin_users", users); }
  function usd(n){ return "₱" + n.toLocaleString("en-US"); }
  function wallet(up){ $("bal").textContent = usd(bal); if(up){ $("wl").classList.remove("bump"); void $("wl").offsetWidth; $("wl").classList.add("bump"); } if(me){ users[me].bal = bal; put("cashin_users", users); } }
  function say(m, t, c){ m.textContent = t; m.className = "msg " + (c || ""); }
  function rnd(n){ return (Math.random() * n) | 0; }
  function el(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
  function stk(){ return allin ? bal : stake; }

  /* ---------- effects ---------- */
  var still = window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches;
  function burst(n, set){
    if(still) return;
    var box = $("fx"), S = set || ["🎉","✨","🪙","💰","⭐"];
    for(var i = 0; i < n; i++){
      var p = el("span", "pc", S[rnd(S.length)]);
      p.style.left = rnd(100) + "%"; p.style.setProperty("--dx", (rnd(160) - 80) + "px"); p.style.setProperty("--r", rnd(720) + "deg"); p.style.setProperty("--t", (1.4 + Math.random() * 1.4) + "s");
      box.appendChild(p); setTimeout(function(x){ x.remove(); }, 3000, p);
    }
  }

  /* ---------- logos (original SVG art) ---------- */
  var ICO = {
    slots:'<circle cx="17" cy="32" r="7"/><circle cx="32" cy="33" r="7"/><path d="M17 25C20 15 26 11 33 9M32 26C31 18 31 13 33 9" fill="none" stroke="#fff" stroke-width="2.5"/>',
    color:'<circle cx="16" cy="16" r="7" fill="#facc15"/><circle cx="32" cy="16" r="7" fill="#f472b6"/><circle cx="16" cy="32" r="7" fill="#3b82f6"/><circle cx="32" cy="32" r="7" fill="#22c55e"/>',
    blackjack:'<rect x="11" y="6" width="26" height="36" rx="4" fill="#fff"/><text x="24" y="31" text-anchor="middle" font-size="17" font-weight="900" fill="#111">21</text>',
    roulette:'<circle cx="24" cy="24" r="18" fill="none" stroke="#fff" stroke-width="3"/><circle cx="24" cy="24" r="5" fill="#fff"/><path d="M24 6V19M24 29V42M6 24H19M29 24H42" stroke="#fff" stroke-width="3"/>',
    coin:'<circle cx="24" cy="24" r="18" fill="#ffd34d"/><circle cx="24" cy="24" r="13" fill="none" stroke="#b8860b" stroke-width="2"/><text x="24" y="31" text-anchor="middle" font-size="20" font-weight="900" fill="#8a6200">₱</text>',
    dice:'<rect x="8" y="8" width="32" height="32" rx="7" fill="#fff"/><circle cx="17" cy="17" r="3" fill="#111"/><circle cx="31" cy="17" r="3" fill="#111"/><circle cx="24" cy="24" r="3" fill="#111"/><circle cx="17" cy="31" r="3" fill="#111"/><circle cx="31" cy="31" r="3" fill="#111"/>',
    hilo:'<path d="M24 5L38 21H10Z" fill="#3ddc97"/><path d="M24 43L10 27H38Z" fill="#ff6b81"/>',
    scratch:'<rect x="5" y="12" width="38" height="24" rx="4" fill="#ffd34d"/><path d="M12 32L30 16" stroke="#8a6200" stroke-width="4" stroke-linecap="round"/><circle cx="35" cy="24" r="3" fill="#8a6200"/>',
    wheel:'<circle cx="24" cy="26" r="17" fill="none" stroke="#fff" stroke-width="3"/><path d="M24 9V43M7 26H41M12 14L36 38M36 14L12 38" stroke="#fff" stroke-width="2"/><path d="M24 2L19 10H29Z" fill="#ffd34d"/>',
    baccarat:'<rect x="6" y="9" width="24" height="33" rx="4" fill="#fff" transform="rotate(-10 18 25)"/><rect x="18" y="7" width="24" height="33" rx="4" fill="#fff" transform="rotate(8 30 23)"/><text x="30" y="30" text-anchor="middle" font-size="16" font-weight="900" fill="#c1121f">B</text>',
    scatter:'<path d="M24 4L29.5 18L44 19L33 28.5L36.5 43L24 35L11.5 43L15 28.5L4 19L18.5 18Z" fill="#ffd34d"/>',
    ace:'<rect x="9" y="5" width="30" height="38" rx="5" fill="#fff"/><text x="24" y="33" text-anchor="middle" font-size="26" font-weight="900" fill="#111">A</text><text x="24" y="14" text-anchor="middle" font-size="9" fill="#d7263d">♥</text>'
  };
  function logo(g){
    var h = g.hue, id = "lg" + g.id;
    return '<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + g.title + ' logo"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(' + ((h + 20) % 360) + ',85%,58%)"/><stop offset="1" stop-color="hsl(' + ((h + 90) % 360) + ',70%,28%)"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#' + id + ')" stroke="#ffffff55" stroke-width="1.5"/><g transform="translate(4 4) scale(.83)" fill="' + (g.type === "slots" ? "#ff3b5c" : "#fff") + '">' + ICO[g.type] + '</g></svg>';

        var r = rnd(2);

        settle(s, b, r === pk.v ? Math.floor(b * 1.95) : 0);
      });
    });
  };

  /* Dice: two dice, under 7 / seven / over 7 */
  var DF = "⚀⚁⚂⚃⚄⚅".split(""), DO = [["Under 7",2.3],["Seven",5.5],["Over 7",2.3]];
  function dhit(t, k){ return k === 0 ? t < 7 : k === 1 ? t === 7 : t > 7; }
  ENG.dice = function(root){
    var box = el("div", "reels"), ds = [0,1].map(function(){ var d = el("div", "reel", "🎲"); box.appendChild(d); return d; });
    var pk = picker(DO.map(function(o){ return [o[0]]; }));
    var s = shell(root, [box, pk.box], "Roll", "Under 7 or Over 7 pays 2.3x. Exactly 7 pays 5.5x.");
    s.btn.addEventListener("click", function(){
      var b = take(s.msg); if(!b) return; s.btn.disabled = true;
      anim(10, function(){ ds.forEach(function(d){ d.textContent = DF[rnd(6)]; }); }, function(){
        var a = rnd(6) + 1, c = rnd(6) + 1;
        ds[0].textContent = DF[a - 1]; ds[1].textContent = DF[c - 1];
        settle(s, b, dhit(a + c, pk.v) ? Math.floor(b * DO[pk.v][1]) : 0, "Total " + (a + c) + ". ");
      });
    });
  };

  /* Hi-Lo: ties lose, win pays 2x */
  function nc(){ return {r:rnd(13) + 1, s:SU[rnd(4)]}; }
  ENG.hilo = function(root){
    var cur = nc(), h = el("div", "hand"), pk = picker([["Higher","#2f855a"],["Lower","#c05621"]]);
    var s = shell(root, [h, pk.box], "Draw", "Pick Higher or Lower. Ties lose. A win pays 2x.");
    function show(n){ h.innerHTML = ""; h.appendChild(cardEl(cur)); h.appendChild(cardEl(n || null)); }
    show();
    s.btn.addEventListener("click", function(){
      var b = take(s.msg); if(!b) return; s.btn.disabled = true;
      anim(8, function(){ show(nc()); }, function(){
        var n = nc(); show(n);
        var ok = pk.v === 0 ? n.r > cur.r : n.r < cur.r;
        cur = n; settle(s, b, ok ? b * 2 : 0);
        setTimeout(function(){ show(); }, 1200);
      });
    });
  };

  /* Scratch card: match 3 symbols */
  var SC = ["🍒","🍋","🔔","⭐","💎","👑"], SM = [2, 2, 3, 3, 5, 10];
  ENG.scratch = function(root){
    var box = el("div", "reels"), cs = [0,1,2].map(function(){ var c = el("div", "reel", "❓"); box.appendChild(c); return c; });
    var s = shell(root, [box], "Scratch", "Match 3 symbols to win. Prizes range from 2x to 10x.");
    s.btn.addEventListener("click", function(){
      var b = take(s.msg); if(!b) return; s.btn.disabled = true;
      anim(10, function(){ cs.forEach(function(c){ c.textContent = SC[rnd(6)]; }); }, function(){
        var w = Math.random() < .22, k = rnd(6), f = [rnd(6), rnd(6), rnd(6)];
        if(w) f = [k, k, k]; else while(f[0] === f[1] && f[1] === f[2]) f[2] = rnd(6);
        cs.forEach(function(c, i){ c.textContent = SC[f[i]]; });
        settle(s, b, w ? b * SM[k] : 0);
      });
    });
  };

  /* Prize wheel */
  var WH = [0,0,0,0,0,0,0,0,.5,.5,1,2,3,5];
  ENG.wheel = function(root){
    var ball = el("div", "ball", "🎯"), s = shell(root, [ball], "Spin the wheel", "Land on 2x, 3x or 5x to win. 1x returns your bet.");
    s.btn.addEventListener("click", function(){
      var b = take(s.msg); if(!b) return; s.btn.disabled = true;
      anim(15, function(){ ball.textContent = WH[rnd(14)] + "x"; }, function(){
        var m = WH[rnd(14)];
        ball.textContent = m + "x"; settle(s, b, Math.floor(b * m));
      });
    });
  };

  /* Scatter: 5x3, 6+ same symbols pay anywhere, 3+ stars = 6 free spins at 2x */
  var SS = ["🍒","🍋","🍇","🔔","💎","👑"], SW = [30,24,19,13,9,5], SPT = [[1,2,4,8],[1.5,3,6,12],[2,4,8,16],[3,6,12,25],[5,10,25,50],[10,25,60,150]], SCAT = "⭐";
  function sPick(){ if(Math.random() < .055) return -1; var r = Math.random() * 100, i = 0; while(r >= SW[i]){ r -= SW[i]; i++; } return i; }
  function sGrid(){ var g = []; for(var i = 0; i < 15; i++) g.push(sPick()); return g; }
  function sEval(g){
    var c = [0,0,0,0,0,0], sc = 0, w = 0;
    g.forEach(function(x){ if(x < 0) sc++; else c[x]++; });
    c.forEach(function(n, i){ if(n >= 6) w += SPT[i][Math.min(n, 9) - 6] * .53; });
    return {win:w, sc:sc};
  }
  function sSpin(){
    var g = sGrid(), e = sEval(g), t = e.win, fs = 0;
    if(e.sc >= 3){ t += [0,0,0,3,10,40][Math.min(e.sc, 5)]; fs = 6; for(var k = 0; k < fs; k++) t += 2 * sEval(sGrid()).win; }
    return {grid:g, total:t, fs:fs, sc:e.sc};
  }
  ENG.scatter = function(root){
    var box = el("div", "ag"), cells = [];
    for(var i = 0; i < 15; i++){ var c = el("div", "ac", "❓"); box.appendChild(c); cells.push(c); }
    var s = shell(root, [box], "Spin", "6+ matching symbols pay anywhere. 3+ ⭐ trigger 6 free spins with 2x wins.");
    s.btn.addEventListener("click", function(){
      var b = take(s.msg); if(!b) return; s.btn.disabled = true;
      anim(10, function(){ cells.forEach(function(c){ c.textContent = SS[rnd(6)]; }); }, function(){
        var r = sSpin();
        r.grid.forEach(function(x, i){ cells[i].textContent = x < 0 ? SCAT : SS[x]; });
        settle(s, b, Math.floor(b * r.total), r.fs ? r.sc + "⭐ Free spins! " : "");
      });
    });
  };

  /* Super Ace: 5x4, ways pay from the left, cascades, golden card turns wild */
  var AP = [.4,.5,.6,.8,1,1.5,2.5,4].map(function(b){ return [b * .1, b * .3, b]; }), AM = [1,2,3,5], AC = ["7","8","9","10","J","Q","K","A"];
  function aCell(c){ return {s:rnd(8), t:rnd(4), g:c > 0 && c < 4 && Math.random() < .1}; }
  function aGrid(){ var g = []; for(var c = 0; c < 5; c++){ var col = []; for(var r = 0; r < 4; r++) col.push(aCell(c)); g.push(col); } return g; }
  function aEval(g){
    var win = 0, hit = g.map(function(c){ return c.map(function(){ return false; }); });
    for(var s = 0; s < 8; s++){
      var cnt = [], L = 0, c;
      for(c = 0; c < 5; c++){ var n = 0; g[c].forEach(function(x){ if(x.s === s || x.s === 8) n++; }); if(!n) break; cnt.push(n); L++; }
      if(L >= 3){
        var w = AP[s][L - 3]; cnt.forEach(function(n){ w *= n; }); win += w;
        for(c = 0; c < L; c++) g[c].forEach(function(x, r){ if(x.s === s || x.s === 8) hit[c][r] = true; });
      }
    }
    return {win:win, hit:hit};
  }
  function aStep(g, hit){
    return g.map(function(col, c){
      var keep = [];
      col.forEach(function(x, r){
        if(!hit[c][r]) keep.push(x);
        else if(x.g && x.s !== 8) keep.push({s:8, t:x.t, g:false});
      });
      while(keep.length < 4) keep.unshift(aCell(c));
      return keep;
    });
  }
  function aSpin(){
    var g = aGrid(), steps = [], total = 0, i = 0;
    while(i < 25){
      var e = aEval(g); if(!e.win) break;
      var m = AM[Math.min(i, 3)];
      steps.push({grid:JSON.parse(JSON.stringify(g)), hit:e.hit, mult:m});
      total += e.win * m * .285; g = aStep(g, e.hit); i++;
    }
    return {steps:steps, total:total, final:g};
  }
  ENG.ace = function(root){
    var box = el("div", "ag"), s = shell(root, [box], "Spin", "3+ matching cards from the left win. Golden cards turn wild. Cascades raise the multiplier up to 5x.");
    function paintAce(g, hit){
      box.innerHTML = "";
      for(var r = 0; r < 4; r++) for(var c = 0; c < 5; c++){
        var x = g[c][r], red = x.t === 1 || x.t === 2 ? " r" : "";
        box.appendChild(el("div", "ac" + red + (x.g ? " gd" : "") + (hit && hit[c][r] ? " h" : ""), x.s === 8 ? "🃏" : AC[x.s] + SU[x.t]));
      }
    }
    paintAce(aGrid());
    s.btn.addEventListener("click", function(){
      var b = take(s.msg); if(!b) return; s.btn.disabled = true;
      anim(8, function(){ paintAce(aGrid()); }, function(){
        var r = aSpin();
        (function run(i){
          if(i >= r.steps.length){ paintAce(r.final); settle(s, b, Math.floor(b * r.total), r.steps.length > 1 ? r.steps.length + " cascades. " : ""); return; }
          paintAce(r.steps[i].grid, r.steps[i].hit); say(s.msg, "Cascade " + (i + 1) + " · x" + r.steps[i].mult);
          setTimeout(function(){ run(i + 1); }, 700);
        })(0);
      });
    });
  };

  /* Baccarat: Player 1:1, Banker 0.95:1, Tie 8:1 (P/B bets push on a tie) */
  function bv(c){ return c.r > 9 ? 0 : c.r; }
  function bt(h){ return h.reduce(function(a, c){ return a + bv(c); }, 0) % 10; }
  ENG.baccarat = function(root){
    var bl = el("div", "lbl", "Banker"), bh = el("div", "hand"), pl = el("div", "lbl", "Player"), ph = el("div", "hand");
    var pk = picker([["Player","#2b6cb0"],["Banker","#c1121f"],["Tie (8x)","#0a8f4e"]]);
    var s = shell(root, [bl, bh, pl, ph, pk.box], "Deal", "Player pays 1:1, Banker pays 0.95:1, Tie pays 8:1.");
    function show(p, k, rev){
      ph.innerHTML = ""; bh.innerHTML = "";
      p.forEach(function(c){ ph.appendChild(cardEl(rev ? c : null)); }); k.forEach(function(c){ bh.appendChild(cardEl(rev ? c : null)); });
      pl.textContent = "Player " + (rev ? bt(p) : ""); bl.textContent = "Banker " + (rev ? bt(k) : "");
    }
    s.btn.addEventListener("click", function(){
      var b = take(s.msg); if(!b) return; s.btn.disabled = true;
      var d = deck(), p = [d.shift(), d.shift()], k = [d.shift(), d.shift()], p3 = null;
      show(p, k, false);
      setTimeout(function(){
        var pt = bt(p), kt = bt(k);
        if(pt < 8 && kt < 8){
          if(pt <= 5){ p3 = d.shift(); p.push(p3); }
          var v = p3 ? bv(p3) : 0, dr = !p3 ? kt <= 5 : kt <= 2 || (kt === 3 && v !== 8) || (kt === 4 && v >= 2 && v <= 7) || (kt === 5 && v >= 4 && v <= 7) || (kt === 6 && (v === 6 || v === 7));
          if(dr) k.push(d.shift());
        }
        show(p, k, true);
        pt = bt(p); kt = bt(k);
        var out = pt > kt ? 0 : kt > pt ? 1 : 2, pay = 0;
        if(out === 2) pay = pk.v === 2 ? b * 9 : b;
        else if(pk.v === out) pay = out === 0 ? b * 2 : Math.floor(b * 1.95);
        settle(s, b, pay, out === 2 ? "Tie. " : out === 0 ? "Player wins. " : "Banker wins. ");
      }, 700);
    });
  };

  /* ---------- demo help chat (scripted bot, not real staff) ---------- */
  var FAQ = [
    [/top.?up|deposit|add (money|funds|credit)|load/, "Tap + Top Up, pick a demo method, enter any amount up to " + "₱500,000 and press Simulate top-up. It only adds play money."],
    [/real|cash.?out|withdraw|gcash|maya|bank|payment|pay/, "No. Cashin is a demo. Top-ups, winnings and withdrawals are all simulated, and nothing is connected to a real bank or e-wallet."],
    [/reset|broke|zero|no money|empty|wallet/, "Out of play money? Open Top Up and add more. It is free and instant."],
    [/odds|fair|rig|win rate|chance/, "Every round uses random results with no forced wins. Payout rules are shown inside each game."],
    [/human|agent|staff|person|support|customer|call|email/, "I'm an automated demo bot. There is no real support team behind this chat, so please don't share personal or payment details here."],
    [/password|account|login|register/, "Accounts are demo-only and are saved on this device in your browser. Never reuse a real password."],
    [/hello|hi|hey|kumusta/, "Hi! I'm the Demo Assistant. Pick a question below or type your own."]
  ];
  function bubble(t, who){ var b = el("div", "b " + who, t); $("hl").appendChild(b); $("hl").scrollTop = 9e5; }
  function ask(q){
    bubble(q, "me"); var a = "I only know a few demo topics: top-ups, play money, odds and accounts. Try one of the quick buttons.";
    var s = q.toLowerCase(); for(var i = 0; i < FAQ.length; i++){ if(FAQ[i][0].test(s)){ a = FAQ[i][1]; break; } }
    setTimeout(function(){ bubble(a, "bot"); }, 500);
  }
  function toggleHelp(on){
    var open = on === undefined ? $("hp").hidden : on; $("hp").hidden = !open; $("hb").setAttribute("aria-expanded", open);
    if(open && !$("hl").children.length) bubble("Hi! I'm the Demo Assistant, an automated bot. I can answer simple questions about this demo.", "bot");
    if(open) $("hi").focus();
  }
  ["How do I top up?", "Is this real money?", "Odds fair?", "Talk to a human"].forEach(function(q){
    var b = el("button", "", q); b.addEventListener("click", function(){ ask(q); }); $("qr").appendChild(b);
  });
  $("hb").addEventListener("click", function(){ toggleHelp(); });
  $("hx").addEventListener("click", function(){ toggleHelp(false); });
  function sendHelp(){ var v = $("hi").value.trim(); if(!v) return; $("hi").value = ""; ask(v); }
  $("hs").addEventListener("click", sendHelp);
  $("hi").addEventListener("keydown", function(e){ if(e.key === "Enter") sendHelp(); });

  nav(); draw();
  var ss = load("cashin_session", null); if(ss && has(ss)) enter(ss);
})();
</script>
